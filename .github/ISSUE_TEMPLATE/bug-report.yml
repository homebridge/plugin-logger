name: Bug-Report
description: Report a Bug to help us improve
title: "Bug:"
labels: [bug]
assignees: 'donavanbecker'
body:
  - type: markdown
    attributes:
      value: |
        You must use the issue template below when submitting a bug.
  - type: input
    attributes:
      label: Describe The Bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    attributes:
      label: To Reproduce
      placeholder: Steps to reproduce the behavior.
    validations:
      required: true
  - type: input
    attributes:
      label: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: Logs
    attributes:
      label: Relevant log output
      placeholder: Bug reports that do not contain logs may be closed without warning. Show the Homebridge logs here. If using Homebridge Config-UI-X, you can easily download your log by visiting the log page on the UI and clicking the Download Icon in the top right. Remove any sensitive information, such as tokens or passwords. Please enable Debug Mode before submitting your issue so more logs can be shared to help fix the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: Config
    attributes:
      label: Config for plugin-logger
      placeholder: Paste your homebridge config.json here. Remove any sensitive information, such as your homebridge-august consumerKey/ consumerSecret / refreshToken.
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable add screenshots to help explain your problem.
      placeholder: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
  - type: input
    attributes:
      label: Device & Model
      placeholder: If applicable, add screenshots to help explain your problem.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Environment
  - type: input
    attributes:
      label: Node.js Version
      placeholder: v14.17.6
    validations:
      required: true  
  - type: input
    attributes:
      label: NPM Version
      placeholder: v7.22.0
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge Version
      placeholder: If applicable, add screenshots to help explain your problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge August Plugin Version
      placeholder: v10.0.1
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge Config UI X Plugin Version
      placeholder: v4.41.2
    validations:
      required: false
  - type: input
    attributes:
      label: Operating System
      placeholder: Raspbian / Ubuntu / Debian / Windows / macOS / Docker
    validations:
      required: true
