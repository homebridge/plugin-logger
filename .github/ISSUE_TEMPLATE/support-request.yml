name: Support Request
description: Need help?
title: "Support Request:"
labels: [question]
assignees: 'donavanbecker'
body:
  - type: markdown
    attributes:
      value: |
        You must use the issue template below when submitting a support request.
  - type: input
    attributes:
      label: Describe Your Problem
      placeholder: A clear and concise description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: Logs
    attributes:
      label: Relevant log output
      placeholder: If relevant, show the Homebridge logs here. If using Homebridge Config-UI-X, you can easily download your log by visiting the log page on the UI and clicking the Download Icon in the top right. Remove any sensitive information, such as tokens or passwords. Please enable Debug Mode before submitting your issue if possible.
      render: shell
    validations:
      required: false
  - type: textarea
    id: Config
    attributes:
      label: Config for plugin-logger
      placeholder: Paste your homebridge config.json here. Remove any sensitive information, such as tokens or passwords.
      render: shell
    validations:
      required: false
  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable add screenshots to help explain your problem.
      placeholder: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
  - type: input
    attributes:
      label: Device & Model
      placeholder: If applicable, add screenshots to help explain your problem.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Environment
  - type: input
    attributes:
      label: Node.js Version
      placeholder: v14.17.5
    validations:
      required: true  
  - type: input
    attributes:
      label: NPM Version
      placeholder: v7.20.5
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge Version
      placeholder: If applicable, add screenshots to help explain your problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge August Plugin Version
      placeholder: v10.0.1
    validations:
      required: true
  - type: input
    attributes:
      label: Homebridge Config UI X Plugin Version
      placeholder: v4.41.2
    validations:
      required: false
  - type: input
    attributes:
      label: Operating System
      placeholder: Raspbian / Ubuntu / Debian / Windows / macOS / Docker
    validations:
      required: true
